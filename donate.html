<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - Giang Hehe</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tích hợp Font Awesome cho icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Import Font Comfortaa và DejaVu Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/dejavu-sans" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Mặc định tất cả chữ là Comfortaa - in đậm */
        body {
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
            background-color: #f4f1fa; /* Nền tím nhạt */
            color: #6c43c0;
            overflow-x: hidden;
        }

        /* Font DejaVu Sans - in đậm */
        .font-dejavu-bold {
            font-family: 'DejaVu Sans', sans-serif;
            font-weight: bold;
        }

        /* Đổ bóng nhẹ cho các thẻ trắng */
        .card-shadow {
            box-shadow: 0 4px 20px rgba(108, 67, 192, 0.08);
        }

        /* Đổ bóng cho Avatar */
        .avatar-shadow {
            box-shadow: 0 6px 24px rgba(108, 67, 192, 0.15);
        }

        /* Logo Momo Tự chế bằng CSS */
        .momo-logo {
            background-color: #a50064;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 0.9;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pt-4 md:pt-6 relative select-none">

    <!-- ================= HEADER / THANH ĐIỀU HƯỚNG ================= -->
    <header class="max-w-6xl w-full mx-auto relative z-50">
        <nav class="bg-white rounded-[28px] px-5 py-2.5 flex items-center justify-between card-shadow">
            
            <!-- Logo con chuột góc trái (Hình 4) -> Chuyển về trang chủ -->
            <a href="index.html" class="flex-shrink-0 hover:scale-105 transition-transform">
                <img src="https://i.ibb.co/212LVzZq/logo.png" alt="logo" border="0" class="w-14 h-14 object-contain" />
            </a>

            <!-- Menu điều hướng ở giữa -->
            <div class="hidden md:flex items-center space-x-6 lg:space-x-12 text-base lg:text-lg text-[#6c43c0]">
                <a href="index.html" class="px-4 py-2 rounded-full hover:bg-[#e9e2f8]/50 transition">Đầu Hẻm</a>
                <a href="chuhem.html" class="px-4 py-2 rounded-full hover:bg-[#e9e2f8]/50 transition">Chủ Hẻm</a>
                <a href="Donate.html" class="bg-[#e9e2f8] px-6 py-2 rounded-full transition hover:bg-[#dcd0f5]">Donate</a>
                <a href="lichstream.html" class="px-4 py-2 rounded-full hover:bg-[#e9e2f8]/50 transition">Lịch Stream</a>
            </div>

            <!-- Cụm Icon góc phải: Avatar, Chuông, Ba gạch -->
            <div class="flex items-center space-x-4 md:space-x-5">
                <!-- Icon Avatar -> chuyển miền đến hosochuot -->
                <a href="hosochuot.html" class="w-11 h-11 rounded-full bg-[#734bd1] overflow-hidden flex items-center justify-center border-2 border-[#734bd1] hover:opacity-90 transition shadow-sm">
                    <img id="avatar-img" src="https://i.ibb.co/HfCMcYyB/hs1.png" alt="avatar" class="w-full h-full object-cover object-top scale-125" />
                </a>

                <!-- Icon Chuông -> chuyển miền đến thongbao -->
                <a href="thongbao.html" class="text-[#734bd1] hover:scale-110 transition">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                    </svg>
                </a>

                <!-- Icon Ba gạch -> Hiện thanh phụ giống Hình 2 -->
                <button id="menu-btn" class="text-[#734bd1] hover:scale-110 transition focus:outline-none">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 6h14M3 12h18M7 18h14"></path>
                    </svg>
                </button>
            </div>
        </nav>

        <!-- Thanh phụ (Dropdown Menu - Hình 2) -->
        <div id="sub-menu" class="hidden absolute right-0 top-[72px] w-72 bg-[#764bd6] text-white rounded-b-[24px] rounded-tl-[24px] shadow-2xl overflow-hidden z-50 flex-col">
            <a href="index.html" class="px-8 py-5 text-right text-lg border-b border-white/30 hover:bg-white/10 transition">Đầu Hẻm</a>
            <a href="chuhem.html" class="px-8 py-5 text-right text-lg border-b border-white/30 hover:bg-white/10 transition">Chủ Hẻm</a>
            <a href="Donate.html" class="px-8 py-5 text-right text-lg border-b border-white/30 hover:bg-white/10 transition">Donate</a>
            <a href="lichstream.html" class="px-8 py-5 text-right text-lg hover:bg-white/10 transition">Lịch Stream</a>
        </div>
    </header>

    <!-- ================= KHU VỰC BANNER & AVATAR ================= -->
    <section class="w-full relative mt-[-40px] z-10">
        <!-- Ảnh Bìa (bia.png) -->
        <div class="w-full h-[280px] md:h-[350px] overflow-hidden">
            <img src="https://i.ibb.co/fVzvQz16/bia.png" alt="bia" class="w-full h-full object-cover object-bottom" />
        </div>

        <!-- Ảnh Avatar (avt.png) đè lên ảnh bìa -->
        <div class="absolute -bottom-16 left-6 md:left-24 lg:left-48">
            <div class="bg-white p-2 rounded-[24px] avatar-shadow w-36 h-36 md:w-44 md:h-44 border-2 border-white">
                <img src="https://i.ibb.co/CdLCF6y/avt.png" alt="avt" class="w-full h-full object-contain rounded-[18px]" />
            </div>
        </div>
    </section>

    <!-- ================= KHU VỰC THÔNG TIN DONATE ================= -->
    <main class="max-w-6xl w-full mx-auto px-6 md:px-24 lg:px-48 mt-24 mb-16 relative z-20 flex flex-col items-center md:items-start">
        
        <!-- Hàng 1: Momo Logo + Chữ MOMO -->
        <div class="flex items-center w-full max-w-[320px] relative mb-6">
            <div class="momo-logo w-[72px] h-[72px] z-10 border-4 border-[#f4f1fa] shadow-sm relative left-2">
                <span class="text-xl font-bold tracking-tight">mo</span>
                <span class="text-xl font-bold tracking-tight">mo</span>
            </div>
            <div class="bg-white h-14 pl-12 pr-8 rounded-r-full card-shadow flex items-center -ml-8 flex-1">
                <span class="font-dejavu-bold text-xl text-[#6c43c0] tracking-wide">MOMO</span>
            </div>
        </div>

        <!-- Hàng 2: Số tài khoản & Dãy số -->
        <div class="flex flex-col md:flex-row gap-4 w-full">
            <!-- Nút Số tài khoản -->
            <div class="bg-white rounded-[20px] px-8 py-4 card-shadow flex items-center justify-center flex-shrink-0">
                <span class="font-dejavu-bold text-lg md:text-[22px] text-[#6c43c0]">Số tài khoản</span>
            </div>

            <!-- Ô chứa dãy số và icon sao chép -->
            <div class="bg-white rounded-[20px] px-6 py-4 card-shadow flex items-center justify-between flex-1 relative cursor-pointer hover:bg-[#faf8ff] transition group" onclick="copyAccountNumber()">
                <span id="accountNumber" class="text-lg md:text-[22px] text-[#6c43c0] tracking-wider">PSP2600312800000512</span>
                <button class="text-[#8c67d6] group-hover:text-[#6c43c0] group-hover:scale-110 transition text-2xl" title="Sao chép">
                    <i class="fa-regular fa-copy"></i>
                </button>
                
                <!-- Toast thông báo Đã sao chép ẩn -->
                <div id="copyToast" class="absolute -top-10 right-0 bg-[#734bd1] text-white text-xs px-3 py-1.5 rounded-lg opacity-0 transition-opacity duration-300 pointer-events-none">
                    Đã sao chép!
                </div>
            </div>
        </div>

        <!-- ================= KHU VỰC MÃ QR & LỜI CẢM ƠN ================= -->
        <div class="w-full flex flex-col items-center mt-12 md:mt-16 space-y-8">
            <!-- Mã QR (qrgianghehe.png) -->
            <div class="w-[320px] h-[320px] md:w-[400px] md:h-[400px] card-shadow rounded-[32px] overflow-hidden bg-white p-2">
                <img src="https://i.ibb.co/jCwqPfk/qrgianghehe.png" alt="qrgianghehe" class="w-full h-full object-contain" />
            </div>

            <!-- Lời cảm ơn -->
            <p class="text-center text-[#6c43c0] text-[15px] md:text-lg max-w-2xl leading-relaxed mt-4">
                Cảm ơn bạn đã tiếp tế cho Giang HeHe! Mỗi chút yêu thương của bạn đều khiến Giang Hehe ấm áp hơn.
            </p>
            <!-- Nút Vòng quay may mắn -->
            <a href="donate-random.html" class="bg-[#734bd1] hover:bg-[#5b36a8] text-white py-4 px-10 md:px-12 rounded-[20px] card-shadow transition-all duration-300 hover:scale-105 text-lg md:text-xl mt-4 flex items-center justify-center gap-3">
                <i class="fa-solid fa-gift"></i>
                Vòng quay may mắn
            </a>
        </div>
        

    </main>

    <!-- ================= JAVASCRIPT XỬ LÝ ================= -->
    <script>
        // Xử lý bật/tắt thanh menu phụ khi ấn vào icon 3 gạch
        const menuBtn = document.getElementById('menu-btn');
        const subMenu = document.getElementById('sub-menu');
        const navAvatarImg = document.getElementById('nav-avatar-img');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            subMenu.classList.toggle('hidden');
            subMenu.classList.toggle('flex');
            navAvatarImg.classList.toggle('opacity-0');
        });

        // Đóng thanh phụ khi bấm ra ngoài
        document.addEventListener('click', (e) => {
            if (!subMenu.contains(e.target) && !menuBtn.contains(e.target)) {
                subMenu.classList.add('hidden');
                subMenu.classList.remove('flex');
                navAvatarImg.classList.remove('opacity-0');
            }
        });

        // Hàm sao chép số tài khoản vào Clipboard
        function copyAccountNumber() {
            const accNumber = document.getElementById('accountNumber').innerText;
            const toast = document.getElementById('copyToast');
            
            navigator.clipboard.writeText(accNumber).then(() => {
                // Hiển thị Toast thông báo
                toast.classList.remove('opacity-0');
                toast.classList.add('opacity-100');
                
                // Tự động ẩn đi sau 2 giây
                setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0');
                }, 2000);
            }).catch(err => {
                alert("Không thể sao chép. Vui lòng copy thủ công: " + accNumber);
            });
        }

        // 3. Cấu hình Supabase
        const SUPABASE_URL = 'https://jmipwcfmnoygqtaadecv.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_ii-OIerOFW00_e7janGKAg_XKhMsDWn'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Hàm kiểm tra đăng nhập và cập nhật riêng Avatar cho thanh điều hướng
        async function checkSessionAndUpdateNavAvatar() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session && session.user) {
                // Lấy link ảnh từ tài khoản, nếu không có thì dùng ảnh con chuột mặc định
                const avatarUrl = session.user.user_metadata?.avatar_url || 'https://i.ibb.co/HfCMcYyB/hs1.png';
                
                // Ở trang Đầu Hẻm, ID của ảnh avatar là 'avatar-img'
                document.getElementById('avatar-img').src = avatarUrl;
            }
        }

        // Chạy hàm ngay khi load trang
        checkSessionAndUpdateNavAvatar();
    </script>
</body>
</html>
