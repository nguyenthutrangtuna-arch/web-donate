<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Vòng Quay - Giang Hehe</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Font -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/dejavu-sans" rel="stylesheet">
    <!-- Tích hợp Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: transparent !important;
            overflow: hidden;
            font-family: 'Comfortaa', cursive;
            font-weight: 700;
        }

        .font-dejavu {
            font-family: 'DejaVu Sans', sans-serif;
            font-weight: bold;
            font-style: italic;
        }

        #wheel-container {
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        #wheel-container.active {
            opacity: 1;
            transform: scale(1);
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 7s cubic-bezier(0.15, 0.9, 0.15, 1); 
            box-shadow: 0 0 40px rgba(118, 75, 214, 0.6);
            border: 8px solid #764bd6;
        }

        .pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 55px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            border: 6px solid #764bd6;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #prizeAlert {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 50;
        }

        #prizeAlert.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen relative">

    <!-- CÁC FILE ÂM THANH -->
    <audio id="spin-sound" src="https://www.myinstants.com/media/sounds/wheel-of-fortune-spin.mp3" preload="auto"></audio>
    <audio id="win-sound" src="https://www.myinstants.com/media/sounds/tada.mp3" preload="auto"></audio>

    <button onclick="testSpin()" class="absolute top-4 left-4 bg-white/30 text-white px-4 py-2 rounded-lg text-sm hover:bg-white/60 z-[100] transition">
        Test Vòng Quay (Bấm 1 lần để mồi âm thanh)
    </button>

    <div id="wheel-container" class="relative w-[650px] h-[650px] flex items-center justify-center">
        <div class="pointer"></div>
        <canvas id="wheel" width="1000" height="1000" class="w-full h-full rounded-full"></canvas>
        <div class="wheel-center">
            <img src="https://i.ibb.co/212LVzZq/logo.png" class="w-14 h-14 object-contain scale-125 ml-1" alt="Logo">
        </div>
    </div>

    <div id="prizeAlert" class="bg-white/95 border-[6px] border-[#764bd6] p-10 rounded-[40px] text-center shadow-[0_10px_50px_rgba(0,0,0,0.5)] min-w-[600px] max-w-[800px]">
        <img src="https://i.ibb.co/212LVzZq/logo.png" class="w-28 h-28 mx-auto mb-4 object-contain animate-bounce">
        <h2 class="text-3xl font-dejavu text-[#764bd6] mb-3"><span id="alertName" class="text-[#ff4757]">Tên</span> vừa quay trúng:</h2>
        <h1 id="alertPrize" class="text-[40px] font-black text-[#ff4757] uppercase leading-[1.3] mb-4 tracking-wide">PHẦN THƯỞNG</h1>
        <p id="alertMessage" class="text-xl text-[#764bd6]/80 italic mt-2"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://jmipwcfmnoygqtaadecv.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_ii-OIerOFW00_e7janGKAg_XKhMsDWn'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ALL_PRIZES = [
            "Cắn Trang Trang ngay lập tức", "Ban 3 con chuột có phô mát trong 5 phút", "Chúc Chuột may mắn lần sau!",
            "Hát karaoke trong 2 phút", "Ban 5 con chuột ngẫu nhiên trong 5p", "Giang Giang là mặt trời nhỏ nè",
            "Quăng game ngay lập tức", "Cắn Giang Giang ngay lập tức", "Ban 1 khiên ngẫu nhiên trong 5p",
            "Ăn một viewer bất kỳ", "Chúc Chuột yêu đi làm về", "Ban 1 người được chỉ định",
            "Live thêm 10 phút"
        ];

        const numSlices = ALL_PRIZES.length;
        const sliceDeg = 360 / numSlices;
        let currentRotation = 0;
        let isSpinning = false;
        let spinQueue = []; 

        function drawWheel() {
            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < numSlices; i++) {
                const startAngle = (i * sliceDeg) * Math.PI / 180;
                const endAngle = ((i + 1) * sliceDeg) * Math.PI / 180;
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, startAngle, endAngle);
                
                if (i % 2 === 0) ctx.fillStyle = '#e9e2f8';
                else if (i % 3 === 0) ctx.fillStyle = '#dcd0f5';
                else ctx.fillStyle = '#ffffff';
                
                ctx.fill();
                ctx.strokeStyle = '#764bd6';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate((i * sliceDeg + sliceDeg / 2) * Math.PI / 180); 
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#6c43c0";
                ctx.font = "bold 17px 'Comfortaa', sans-serif";
                
                const text = ALL_PRIZES[i];
                const shortText = text.length > 30 ? text.substring(0, 30) + '...' : text;
                ctx.fillText(shortText, radius - 30, 0); 
                ctx.restore();
            }
        }

        function spinTo(prizeStr, userName, message) {
            document.getElementById('wheel-container').classList.add('active');
            const spinAudio = document.getElementById('spin-sound');
            spinAudio.currentTime = 0;
            spinAudio.play().catch(e => console.log('Lỗi phát âm thanh quay:', e));

            const indices = [];
            ALL_PRIZES.forEach((p, i) => { if (p === prizeStr) indices.push(i); });
            const index = indices.length > 0 ? indices[Math.floor(Math.random() * indices.length)] : 0;
            
            const sliceCenter = index * sliceDeg + sliceDeg / 2;
            const randomOffset = (Math.random() - 0.5) * (sliceDeg * 0.7); 
            let targetRotation = -90 - sliceCenter + randomOffset + (360 * 8); 
            
            const remainder = currentRotation % 360;
            let nextRot = currentRotation - remainder + targetRotation;
            if (nextRot <= currentRotation + 360 * 3) nextRot += 360 * 5;
            
            currentRotation = nextRot;
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;
            
            setTimeout(() => {
                spinAudio.pause(); 
                showPrizeAlert(prizeStr, userName, message);
            }, 7000);
        }

        function showPrizeAlert(prize, name, message) {
            const winAudio = document.getElementById('win-sound');
            winAudio.currentTime = 0;
            winAudio.play().catch(e => console.log(e));

            const alertBox = document.getElementById('prizeAlert');
            document.getElementById('alertName').innerText = name;
            document.getElementById('alertPrize').innerText = prize;
            document.getElementById('alertMessage').innerText = message ? `"${message}"` : "";
            alertBox.classList.add('show'); 
            
            // CÚ PHÁP ĐỌC CỦA CHỊ GOOGLE
            const speakText = `${name} đã quay được, ${prize}. ${message ? 'Với lời nhắn: ' + message : ''}`;
            
            setTimeout(() => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); 
                    const utterance = new SpeechSynthesisUtterance(speakText);
                    utterance.lang = 'vi-VN';
                    utterance.rate = 1.0; 
                    
                    utterance.onend = () => finishAlert(alertBox);
                    
                    // Phát âm thanh
                    window.speechSynthesis.speak(utterance);
                } else {
                    setTimeout(() => finishAlert(alertBox), 6000);
                }
            }, 1500); // Chờ 1.5s cho tiếng pháo hoa nổ xong mới đọc
        }

        function finishAlert(alertBox) {
            setTimeout(() => {
                alertBox.classList.remove('show');
                document.getElementById('wheel-container').classList.remove('active');
                setTimeout(() => {
                    isSpinning = false;
                    processQueue(); 
                }, 1500); 
            }, 5000); 
        }

        function processQueue() {
            if (isSpinning || spinQueue.length === 0) return;
            isSpinning = true;
            const data = spinQueue.shift();
            spinTo(data.prize, data.user_name, data.message);
        }

        supabaseClient
            .channel('realtime_spin')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'spin_history' }, payload => {
                const data = payload.new;
                if (data.spin_type === 'VQ1') {
                    spinQueue.push(data);
                    processQueue();
                }
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') console.log('Đã kết nối luồng Realtime Supabase!');
            });

        function testSpin() {
            spinQueue.push({
                user_name: "Chuột Test",
                message: "Chúc Streamer hôm nay leo rank thành công nha!",
                prize: ALL_PRIZES[Math.floor(Math.random() * ALL_PRIZES.length)]
            });
            processQueue();
        }

        // Mồi load sẵn giọng đọc của trình duyệt để không bị trễ nhịp
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        drawWheel();
    </script>
</body>
</html>
